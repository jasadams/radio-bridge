[package]
name = "transcoder"
version = "0.1.0"
edition = "2024"

[features]
default = ["ffmpeg", "native"]
ffmpeg = []
native = ["dep:symphonia-core", "dep:symphonia-bundle-mp3", "dep:fdk-aac", "dep:reqwest", "dep:tokio-stream"]

[dependencies]
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }
tracing = "0.1"

# Native backend
symphonia-core = { version = "0.6.0-alpha.2", optional = true }
symphonia-bundle-mp3 = { version = "0.6.0-alpha.2", optional = true }
fdk-aac = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"], optional = true }
tokio-stream = { version = "0.1", optional = true }
