<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" rx="60" fill="#1a1a2e"/>
  <!-- Antenna -->
  <line x1="150" y1="60" x2="150" y2="160" stroke="#e94560" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="60" x2="110" y2="100" stroke="#e94560" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="60" x2="190" y2="100" stroke="#e94560" stroke-width="6" stroke-linecap="round"/>
  <!-- Radio waves -->
  <path d="M 90 130 Q 90 100 120 90" fill="none" stroke="#e94560" stroke-width="4" opacity="0.5"/>
  <path d="M 70 150 Q 70 100 110 80" fill="none" stroke="#e94560" stroke-width="4" opacity="0.3"/>
  <path d="M 210 130 Q 210 100 180 90" fill="none" stroke="#e94560" stroke-width="4" opacity="0.5"/>
  <path d="M 230 150 Q 230 100 190 80" fill="none" stroke="#e94560" stroke-width="4" opacity="0.3"/>
  <!-- Speaker -->
  <rect x="115" y="170" width="30" height="50" rx="4" fill="#e94560"/>
  <path d="M 145 170 L 175 150 L 175 230 L 145 220 Z" fill="#e94560"/>
  <!-- Sound waves from speaker -->
  <path d="M 185 175 Q 200 190 185 210" fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 195 165 Q 215 190 195 220" fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- Bridge arc -->
  <path d="M 60 250 Q 150 200 240 250" fill="none" stroke="#16213e" stroke-width="8" stroke-linecap="round"/>
  <path d="M 60 250 Q 150 210 240 250" fill="none" stroke="#e94560" stroke-width="3" opacity="0.6"/>
</svg>
