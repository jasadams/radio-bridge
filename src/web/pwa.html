<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/app-icon.svg">
<title>Radio Bridge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; min-height: 100dvh; }
.app { max-width: 480px; margin: 0 auto; padding: 16px; padding-top: env(safe-area-inset-top, 16px); }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #fff; }
.speaker-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.speaker-bar select { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #333; background: #16213e; color: #eee; font-size: 15px; }
.stations { display: flex; flex-direction: column; gap: 8px; }
.station { display: flex; align-items: center; gap: 12px; background: #16213e; border-radius: 12px; padding: 12px; cursor: pointer; transition: background 0.15s; border: none; width: 100%; text-align: left; color: #eee; font-size: 15px; }
.station:active { background: #0f3460; }
.station img { width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0; }
.station .info { flex: 1; min-width: 0; }
.station .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station .ch { font-size: 12px; color: #888; }
.playing { border: 2px solid #e94560; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #e94560; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; display: none; z-index: 100; }
.loading { text-align: center; padding: 40px; color: #666; }
</style>
</head>
<body>
<div class="app">
  <h1>Radio Bridge</h1>
  <div class="speaker-bar">
    <select id="speaker"><option value="">Loading speakers...</option></select>
  </div>
  <div id="stations" class="stations"><div class="loading">Loading stations...</div></div>
</div>
<div id="toast"></div>
<script>
let currentChannel = null;

async function loadSpeakers() {
  try {
    const res = await fetch('/api/speakers');
    const speakers = await res.json();
    const sel = document.getElementById('speaker');
    sel.innerHTML = speakers.map(s =>
      '<option value="' + s.ip + '">' + s.name + ' (' + s.model + ')</option>'
    ).join('');
    const saved = localStorage.getItem('lastSpeaker');
    if (saved && speakers.some(s => s.ip === saved)) { sel.value = saved; }
    else { const lr = speakers.find(s => s.name.includes('Living Room')); if (lr) sel.value = lr.ip; }
  } catch(e) { console.error('Speaker load failed', e); }
}

async function loadStations() {
  try {
    const res = await fetch('/api/stations');
    const lineup = await res.json();
    const radio = lineup.filter(ch => !ch.VideoCodec);
    const div = document.getElementById('stations');
    div.innerHTML = radio.map(ch => {
      const num = ch.GuideNumber;
      const name = ch.GuideName || 'Unknown';
      return '<button class="station" onclick="play(\'' + num + '\',this)" data-ch="' + num + '">'
        + '<img src="/logo/' + num + '" width="48" height="48" style="border-radius:8px;flex-shrink:0;background:#333" onerror="this.style.display=\'none\'">'
        + '<div class="info"><div class="name">' + name + '</div><div class="ch">Ch ' + num + '</div></div>'
        + '</button>';
    }).join('');
  } catch(e) { console.error('Station load failed', e); }
}

async function play(channel, btn) {
  const speaker = document.getElementById('speaker').value;
  if (!speaker) { toast('Select a speaker first'); return; }
  localStorage.setItem('lastSpeaker', speaker);
  toast('Starting...');
  document.querySelectorAll('.station').forEach(s => s.classList.remove('playing'));
  btn.classList.add('playing');
  try {
    const res = await fetch('/api/play', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({speaker, channel})
    });
    const data = await res.json();
    if (data.status === 'ok') { toast('Playing ' + data.title); currentChannel = channel; }
    else { toast('Error: ' + data.error); btn.classList.remove('playing'); }
  } catch(e) { toast('Failed: ' + e.message); btn.classList.remove('playing'); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

loadSpeakers();
loadStations();
</script>
</body>
</html>
